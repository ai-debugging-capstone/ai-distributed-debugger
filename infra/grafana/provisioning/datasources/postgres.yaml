apiVersion: 1

deleteDatasources:
  - name: RCA PostgreSQL
    orgId: 1

datasources:
  - name: RCA PostgreSQL
    uid: rca-postgres
    type: postgres
    access: proxy
    url: rca-db:5432
    user: ${POSTGRES_USER}
    database: ${POSTGRES_DB}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1700
      timescaledb: false
      maxOpenConns: 20
      maxIdleConns: 4
      connMaxLifetime: 14400
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
