[pytest]
minversion = 8.3
addopts = -ra --strict-markers
testpaths = app/tests tests/rca tests/integration
pythonpath = app .
cache_dir = tmp/m5-pytest-cache
asyncio_mode = auto
markers =
    postgres: integration tests against a real PostgreSQL server (explicit opt-in)
    component: in-memory integration across normalization, analytics, and real model inference
